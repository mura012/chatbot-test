<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チャットボット サンプル</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div>
        <h1>チャットボット</h1>
        <p class="subtitle">学習用サンプル — Web UI + API</p>
      </div>
      <div class="status" id="status-badge">接続中...</div>
    </header>

    <main class="chat-container" id="chat-container" aria-live="polite">
      <div class="message assistant">
        <div class="bubble">
          こんにちは！メッセージを入力して会話を始めてください。
        </div>
      </div>
    </main>

    <footer class="input-area">
      <form id="chat-form">
        <input
          type="text"
          id="message-input"
          placeholder="メッセージを入力..."
          autocomplete="off"
          required
        />
        <button type="submit" id="send-button">送信</button>
      </form>
      <button type="button" id="clear-button" class="clear-button">会話をクリア</button>
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
